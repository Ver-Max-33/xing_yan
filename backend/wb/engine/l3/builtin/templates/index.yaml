# 内置模板库 (spec §6.6)。箱体模板按箱体做法转写，没定死的数字都是参数；通用模板转写自开源项目的策略说明。
# shape 是这个形态的样子，basis 是依据；describe 是一个人会怎么用一句话描述这个流程——它同时是 AI 起草规则的少样本示例（§6.1）。
# examples 只列确认过的例子。
- id: tpl_calm_breakout
  group: box
  shape: 大箱（或大箱里更窄的一段横盘）里 K 线短小平稳，收盘越过箱顶
  basis: K 线短小平稳说明有人控盘；先画大箱，再在大箱里分中箱；A 股 2016–2026 年的回测
  describe: 横盘了好几个月的大箱子（或者大箱里后来更窄的一段横盘），箱里的 K 线都很短、走得很平稳，收盘突破箱顶的那天提醒我。
- id: tpl_xia_heng_shang
  group: box
  shape: 下跌后 3–6 个月的大箱，按黑马基因检查，末端放量突破
  basis: 下跌后的低位大箱，按黑马基因逐条检查
  describe: 股价跌了一段之后，在低位横盘三到六个月形成大箱体；箱体期间比大盘强、红肥绿瘦，60 日线走平或往上；放量突破大箱顶、上方至少还有 10% 空间的时候提醒我。
- id: tpl_shang_heng_shang
  group: box
  shape: 上涨后两个月内的窄箱，去掉 3–6 个月这一条
  basis: 上涨之后的窄箱整理
  describe: 先涨一波 20% 以上，然后横盘不超过两个月、箱子窄（箱宽 15% 以内），放量突破箱顶那天选出来。
- id: tpl_giraffe
  group: box
  shape: 腿：连续涨停（大长腿 2 个以上，小矮腿 1 个，是参数）；腰：腿之后不在高位、越扁越好的小箱；脖子：腰的突破（小矮腿的"几根大阳"、向下找线的斜箱回调，这个模板没有包括）
  basis: 长颈鹿的腿、腰、脖子
  describe: 长颈鹿：先连着两个以上涨停拉出一条腿，然后在不高的位置横几天、箱子很扁，腰部突破的那天提醒我。
- id: tpl_tian_pin
  group: box
  shape: 大箱上破后，在原箱顶上方横盘或缓慢上斜，再次突破
  basis: 天品：大箱突破后在原箱顶上方再整理一次
  describe: 大箱突破以后，在原来的箱顶上方又横了一个小箱（或者慢慢往上斜的小通道），小箱放量再突破的时候选出来。
- id: tpl_shang_pin
  group: box
  shape: 大箱内贴着箱顶的小横盘，或从箱内中下部缓升顶到箱顶，随后突破
  basis: 上品：贴着箱顶的小横盘
  describe: 大箱里面贴着箱顶有一个小横盘（或者从下面慢慢斜着顶上来），等大箱放量向上突破的那天提醒我。
- id: tpl_xia_pin_turn
  group: box
  shape: 大箱内离箱顶有距离的小箱，在小箱拐点或突破时买；买点到大箱顶至少 10%
  basis: 下品：离箱顶还有一段距离的小箱
  describe: 大箱里面、离箱顶还有一段距离的地方有个小箱，小箱自己放量突破、而且离大箱顶至少还有 10% 空间的时候提醒我。
- id: tpl_xia_pin_big
  group: box
  shape: 小箱离大箱顶 10% 以内，等放量突破大箱顶时买
  basis: 下品：离箱顶 10% 以内的小箱
  describe: 大箱里有个下品小箱，离大箱顶在 10% 以内，等大箱放量向上突破的那一天再选出来。
- id: tpl_bian_yi_xia_pin
  group: box
  shape: 大箱末端一个缓缓上升的小通道（向上的斜小箱），离大箱顶 10% 以内，等放量突破大箱顶时买
  basis: 变异下品：大箱里缓缓上升的小通道，离箱顶 10% 以内最好
  describe: 大箱末端股价沿着一个往上斜的小通道慢慢爬，离大箱顶不到 10%，等它放量向上突破大箱顶的那一天再选出来。
- id: tpl_zhuang_ding
  group: box
  shape: 涨停价恰好顶到大箱顶，也当作一种突破；模板默认算突破，可在澄清卡片里改
  basis: 涨停顶到箱顶也算突破
  describe: 涨停价正好顶到中箱或大箱的箱顶、收盘没越过去的那天，也算突破，选出来。
- id: tpl_xia_po_hui_xiang
  group: box
  shape: 跌破箱底后缩量、很快收回箱内
  basis: 破箱回箱：假跌破之后收回
  describe: 收盘跌破箱底之后缩量，很快又收回到箱子里，回箱的那天选出来。
  examples:
    - {listing_id: "CN:002888", date: 2018-08-06, note: 第一次破箱和回箱：八月跌破中箱底、四天后收回}
    - {listing_id: "CN:002888", date: 2018-10-09, note: 十月的破箱和回箱：跌破大箱底、第二天收回}
- id: tpl_xing_mo_liang_jin
  group: box
  shape: 中箱、大箱的末端波动收窄、K 线变小、量缩到箱里高峰的四分之一以下（形末量尽），随后放量突破箱顶；均线粘合是开关
  basis: 黑马基因里的形末量尽
  describe: 横盘到最后，K 线越走越小、成交量缩到只有箱里最活跃时的几分之一，然后突然放出好几倍的量冲过箱顶，那天提醒我。
  examples:
    - {listing_id: "CN:002300", date: 2016-12-30, note: 箱里一长段缩着的量，12-28 突然出量（前一天的 8 倍）；01-04 涨停突破，系统画的中箱 12-30 收盘越过箱顶}
- id: tpl_yang_liang_qun
  group: box
  shape: 箱里的量比箱前两个月高出一倍以上、阳线的量占六成以上（阳量群、红肥绿瘦），价格还在箱里，随后向上突破
  basis: 金品的两种状态：形末量尽、阳量群
  describe: 箱子里的成交量明显比前两个月大、而且大多是涨的那几天放的量，价格却一直在箱里横着，等它向上突破箱顶的那天提醒我。
  examples:
    - {listing_id: "CN:603378", date: 2018-11-21, note: 变异天品里很漂亮的一个阳量群，11-21 放量涨停突破上轨}
    - {listing_id: "CN:002058", date: 2018-11-16, note: 天品小箱里很高的阳量群，11-16 放量涨停突破}
- id: tpl_ma_pullback
  group: general
  shape: 均线向上时缩量回落到均线附近、收盘仍在线上
  basis: daily_stock_analysis「缩量回踩」
  describe: 20 日线往上走，股价缩量回落到 20 日线附近、收盘还在线上的时候提醒我。
- id: tpl_ma_bunch
  group: general
  shape: 5、10、20、60 日线粘合后，5、10、20 日线依次排开开始发散，60 日线走平或上翘
  basis: 均线粘合后发散；黑马基因
  describe: 5、10、20、60 日线先粘在一起，然后 5 日线在 10 日线上、10 日线在 20 日线上开始发散，60 日线走平或往上，收盘站上 5 日线并且放量的那天选出来。
- id: tpl_macd_bull_div
  group: general
  shape: 价格新低而 DIF 不新低（底背离），随后金叉
  basis: 常见形态（箱体里的背离不作箱体条件）
  describe: MACD 底背离：两个低点后一个更低、DIF 却更高，之后几天内（默认 10 天）DIF 金叉 DEA 的那天提醒我。
- id: tpl_limit_pullback
  group: general
  shape: 涨停后几天缩量回调（A 股）
  basis: 常见形态
  describe: A 股：最近五天里涨停过，今天没涨停、收跌、缩量回调的时候选出来。
- id: tpl_new_high
  group: general
  shape: 收盘创 N 日新高并放量
  basis: InStock「平台突破」、daily_stock_analysis「放量突破」、年内向左
  describe: 收盘创半年新高（120 天），并且放量的那天选出来。
