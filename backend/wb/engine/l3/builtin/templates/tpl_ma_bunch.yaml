id: tpl_ma_bunch
name: 均线粘合后发散
doc: >-
  通用模板：5、10、20、60 日线先粘合（离散度小），然后 5 > 10 > 20 依次排开、
  开始发散，收盘站上 5 日线并放量，60 日线走平或上翘（黑马基因里的一条；中能电气就是三条均线逐渐靠拢粘合、60 日线走平上翘
  的例子），那一根收盘后出信号。粘合多紧算粘合没有定数，是参数：A 股 2016–2026 的事件研究里，离散度越紧 20 日超额
  越好（两段各自单调），2% 比原来的 5% 在两段都高出噪声（胜率 36.6% 对 33.1%、53.2% 对 51.2%），所以默认 2%（台账 2026-10-07 规则审计）。
  60 日线的斜率和下横上一个口径（5 根里平均每根不低于 −0.05%：走平或往上，留一点余地）：按规则自己的买卖，加上它两段都略好、在噪声
  以内。60 日线不排进多头排列（10-12 你定的，台账 2026-10-07 规则审计末节）：按规则自己的买卖和同一天随机买的比，排进去两段都更差
  （−0.43% / −1.74% 对 −0.24% / −1.08%），按 20 日超额两段也都略差，信号少三分之一；原来的说法也只要求 60 日线走平或者上翘。
markets: [CN, JP]
universe: {exclude: [st, listed_lt_120d]}
params:
  - {id: spread, value: 0.02, range: [0.01, 0.10], step: 0.005, tune: true, unit: "%"}
  - {id: vol, value: 1.5, range: [1.0, 3.0], step: 0.1, tune: true, unit: 倍}
  - {id: ma60, value: -0.0005, range: [-0.002, 0.002], step: 0.0005, unit: "%"}
stages:
  - id: today
    kind: event
    when: "REF(MA_SPREAD([5, 10, 20, 60]), 5) <= $spread AND MA_ALIGN([5, 10, 20], up) AND C > MA(C, 5) AND VOL_RATIO(5) >= $vol"
    at:
      - {id: ma60, label: 60 日线走平或上翘, expr: "MA_SLOPE_PCT(60, 5) >= $ma60"}
signal_at: today.at
judge: {fail: "MA(C, 60)", days: 60}
