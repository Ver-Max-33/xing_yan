id: tpl_xing_mo_liang_jin
name: 箱体末端缩到量尽后放量突破（形末量尽）
doc: >-
  箱体模板：箱体震荡里波动逐渐收窄、K 线变小、量能缩到很小（从最高缩到最低至少四五倍），叫形末量尽；
  之后突然放量突破箱顶那一根收盘后出信号（太阳电缆是一例：量尽之后突然出了至少四倍的量）。收敛只说明准备好了，
  不说明方向，所以等突破。量尽按箱的最后 10 根里最小的 5 日均量 ÷ 箱里最高的 5 日均量；突破量和这段地量比，不和昨天比
  （太阳电缆突破那天的量是地量的 19 倍，却只有前一天的 1.4 倍）。均线粘合是可选的开关：有的形末量尽了，均线并没有粘合。
  中箱、大箱；没定死的数字都是参数。
markets: [CN, JP]
universe: {exclude: [st, listed_lt_120d, resumed_lt_20d]}
params:
  - {id: dry, value: 0.25, range: [0.1, 0.5], step: 0.05, tune: true, unit: 倍}
  - {id: small, value: 0.8, range: [0.5, 1.0], step: 0.1, tune: true, unit: 倍}
  - {id: burst, value: 4.0, range: [2.0, 8.0], step: 1.0, tune: true, unit: 倍}
  - {id: glue, value: false}
  - {id: spread, value: 0.02, range: [0.01, 0.05], step: 0.005, unit: "%"}
stages:
  - id: box
    kind: structure
    use: BOX
    with: {scale: [mid, long]}
    during:
      - {id: dry, label: 箱末量尽, expr: "MIN(MA(V, 5), last=10) / MAX(MA(V, 5)) <= $dry", unit: 倍}
      - {id: small, label: 箱末 K 线变小, expr: "MIN(MA(BAR_LEN, 5), last=10) / MEAN(BAR_LEN) <= $small", unit: 倍}
      - {id: glue, label: 均线粘合（开关 glue）, expr: "$glue == 0 OR LAST(MA_SPREAD([5, 10, 20]), last=1) <= $spread"}
  - id: breakout
    kind: event
    on: box.break_up
    at:
      - {id: burst, label: 突破量是箱末地量的几倍, expr: "V / MIN(MA(V, 5), of=box, last=10) >= $burst", unit: 倍}
signal_at: breakout.at
watch_stage: box
ranking:
  - {expr: "MIN(MA(V, 5), of=box, last=10) / MAX(MA(V, 5), of=box)", dir: asc, label: 箱末量尽, unit: 倍}
plan:
  entry: cross   # 盘中第一次碰到潜伏等着突破的箱顶就买（盯盘的买法；设计 2026-10-11 §6、台账 2026-10-11-trade-plans-p2）
  stop:
    - {line: "box.false_bottom", label: 假底}
    - {line: "box.bottom * 0.985", label: 箱底（没有假底时）}
  exit:
    - {when: "C < MA(C, 5)", label: 跌破 5 日线（两线 / 三线卖法的日线读法）}
  days: 60
