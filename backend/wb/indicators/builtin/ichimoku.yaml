id: ichimoku
name: 一目均衡表
doc: 转换线、基准线，和推后 K 根的先行带（云）：价格在云上方偏多。云画到今天为止，今天以后那一段不画；迟行线要把收盘往前挪、用到未来，不画。
group: common
pane: main
params:
- {id: T, value: 9, range: [2, 100], step: 1}
- {id: K, value: 26, range: [2, 200], step: 1}
- {id: S, value: 52, range: [2, 300], step: 1}
source: TradingView 内置指标的公开算法（Ichimoku Cloud）
formula: |
  转换线:(HHV(HIGH,T)+LLV(LOW,T))/2;
  基准线:(HHV(HIGH,K)+LLV(LOW,K))/2;
  A:=(转换线+基准线)/2;
  B:=(HHV(HIGH,S)+LLV(LOW,S))/2;
  先行A:REF(A,K),COLORUP;
  先行B:REF(B,K),COLORDOWN;
  DRAWBAND(先行A,COLORUP,先行B,COLORDOWN);
