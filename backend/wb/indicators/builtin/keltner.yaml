id: keltner
name: 肯特纳通道
doc: N 日指数均线上下加减 MULT 倍 ATR(ATRN)（Wilder 平滑）：价格冲出上轨是强势，回到通道里动能减弱。
group: common
pane: main
params:
- {id: N, value: 20, range: [2, 250], step: 1}
- {id: ATRN, value: 10, range: [1, 100], step: 1}
- {id: MULT, value: 2, range: [0.5, 5], step: 0.5}
source: TradingView 内置指标的公开算法（Keltner Channels）
formula: |
  TR:=MAX(MAX(HIGH-LOW,ABS(HIGH-REF(CLOSE,1))),ABS(LOW-REF(CLOSE,1)));
  中轨:EMA(CLOSE,N);
  上轨:中轨+MULT*SMA(TR,ATRN,1);
  下轨:中轨-MULT*SMA(TR,ATRN,1);
