id: ict_equal_hl
name: 等高等低
doc: 相邻两个摆动高点（低点）相差不到 TOL%：两次都在差不多的价位停住，上方（下方）积了一片止损单，ICT 认为价格常会去扫掉它。从前一个高（低）点画到被突破为止。原脚本给日内图的容差是 0.05%，日线默认 0.3%。
group: ict
pane: main
params:
- {id: LEFT, value: 5, range: [1, 100], step: 1}
- {id: RIGHT, value: 5, range: [1, 50], step: 1}
- {id: TOL, value: 0.3, range: [0.05, 2], step: 0.05}
- {id: END, value: 1, range: [0, 3], step: 1}
- {id: MAXN, value: 10, range: [0, 200], step: 1}
source: ArunKBhaskar/PineScript · ICT Equal Highs and Lows
formula: |
  PH:=REF(HIGH,RIGHT)=HHV(HIGH,LEFT+RIGHT+1) AND REF(HIGH,RIGHT)>REF(HHV(HIGH,LEFT),RIGHT+1);
  PL:=REF(LOW,RIGHT)=LLV(LOW,LEFT+RIGHT+1) AND REF(LOW,RIGHT)<REF(LLV(LOW,LEFT),RIGHT+1);
  高:=VALUEWHEN(PH,REF(HIGH,RIGHT));
  低:=VALUEWHEN(PL,REF(LOW,RIGHT));
  等高:=PH AND ABS(高/REF(高,1)-1)*100<=TOL;
  等低:=PL AND ABS(低/REF(低,1)-1)*100<=TOL;
  DRAWLEVEL(等高,MAX(高,REF(高,1)),END,REF(BARSLAST(PH),1)+1+RIGHT,MAXN),COLORDOWN,LINETHICK2;
  DRAWLEVEL(等低,MIN(低,REF(低,1)),END,REF(BARSLAST(PL),1)+1+RIGHT,MAXN),COLORUP,LINETHICK2;
