id: vr
name: VR 成交量比率
doc: 上涨日的量和下跌日的量之比（平盘日各算一半）：100 附近是均衡，越高买气越旺。
group: common
pane: sub
params:
- {id: M1, value: 26, range: [2, 250], step: 1}
- {id: M2, value: 6, range: [1, 100], step: 1}
levels: [100]
source: 通达信同名指标的公式
formula: |
  TH:=SUM(IF(CLOSE>REF(CLOSE,1),VOL,0),M1);
  TL:=SUM(IF(CLOSE<REF(CLOSE,1),VOL,0),M1);
  TQ:=SUM(IF(CLOSE=REF(CLOSE,1),VOL,0),M1);
  VR:100*(TH*2+TQ)/(TL*2+TQ);
  MAVR:MA(VR,M2);
