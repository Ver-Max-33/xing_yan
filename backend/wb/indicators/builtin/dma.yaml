id: dma
name: DMA 平行线差
doc: 短均线减长均线（DIF）和它的均线：DIF 在 0 上方是短线强于长线。
group: common
pane: sub
params:
- {id: N1, value: 10, range: [1, 250], step: 1}
- {id: N2, value: 50, range: [1, 250], step: 1}
- {id: M, value: 10, range: [1, 100], step: 1}
levels: [0]
source: 通达信同名指标的公式
formula: |
  DIF:MA(CLOSE,N1)-MA(CLOSE,N2);
  DIFMA:MA(DIF,M);
