id: ema_ribbon
name: EMA 均线组
doc: 四条指数均线（20、50、100、200）：挤在一起时趋势还没出来，从短到长依次排开是趋势成形。组合设置（Vijay Thakare）用的均线组。
group: common
pane: main
params:
- {id: N1, value: 20, range: [1, 500], step: 1}
- {id: N2, value: 50, range: [1, 500], step: 1}
- {id: N3, value: 100, range: [1, 500], step: 1}
- {id: N4, value: 200, range: [1, 500], step: 1}
source: ArunKBhaskar/PineScript · Momentum Setup - Vijay Thakare（只取它的均线组）
formula: |
  EMA1:EMA(CLOSE,N1);
  EMA2:EMA(CLOSE,N2);
  EMA3:EMA(CLOSE,N3);
  EMA4:EMA(CLOSE,N4);
