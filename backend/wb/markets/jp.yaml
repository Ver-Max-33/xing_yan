# Japan (TSE) market profile (spec §3.5 mechanism 2, §4.5, §4.8)
market: JP
timezone: Asia/Tokyo
currency: JPY
lot_size: 100
sessions: [["09:00", "11:30"], ["12:30", "15:30"]]
ready_window: {start: "16:30", end: "20:00", poll_minutes: 10}
refetch_at: "08:30"
xcals_calendar: XTKS
limit_rule: flag            # judge limit-up/down by J-Quants UL/LL flags
benchmark: {test: "JP:IDX:N225", prod: "JP:IDX:TOPIX"}
# TSE daily price limits (値幅制限), JPX "制限値幅" table checked 2026-10-02:
# [base price upper bound (exclusive), limit width in yen]; null bound = and above.
price_limits: [[100, 30], [200, 50], [500, 80], [700, 100], [1000, 150], [1500, 300], [2000, 400],
               [3000, 500], [5000, 700], [7000, 1000], [10000, 1500], [15000, 3000], [20000, 4000],
               [30000, 5000], [50000, 7000], [70000, 10000], [100000, 15000], [150000, 30000],
               [200000, 40000], [300000, 50000], [500000, 70000], [700000, 100000], [1000000, 150000],
               [1500000, 300000], [2000000, 400000], [3000000, 500000], [5000000, 700000],
               [7000000, 1000000], [10000000, 1500000], [15000000, 3000000], [20000000, 4000000],
               [30000000, 5000000], [50000000, 7000000], [null, 10000000]]
# Whole days the exchange halted all trading: every stock has a row without prices, which would otherwise read as a
# half-published day (data/quality mass_suspension). 2020-10-01: TSE's arrowhead system failed, no trading all day
# (JPX announcement; J-Quants: 4,047 of 4,047 rows without prices, checked 2026-10-08).
halts: ["2020-10-01"]
# Boards that are not stocks, as J-Quants (by 商品区分) and JPX's list name them: funds, the Bank of Japan's 出資証券, and
# PRO Market, which only professional investors may buy. The stock pool — rules, 选股, the market page — leaves them out
# (J-Quants put the funds under その他 until 2026-10-08; checked that day: no stock is on it).
non_stock_boards: ["ETF・ETN", "REIT・ベンチャーファンド・カントリーファンド・インフラファンド", "出資証券", "TOKYO PRO MARKET", "PRO Market",
                   "その他"]
