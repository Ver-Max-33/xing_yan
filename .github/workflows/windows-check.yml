# Windows 检查（只手动运行）：在 GitHub 的 Windows 机器上把后端按安装包里的样子打包（PyInstaller），做一个和 A 股一样大的
# 模拟市场（packaging/bench_data.py，约 1200 万根日线），先一个进程算结构、再用进程池算、最后像「扫描」按钮那样扫一次
# （packaging/scan_check.py）：每 5 秒记下走到哪、后端几个进程、占多少内存、机器还剩多少；超时算卡住，打出每个进程的线程栈。
# 还查检查更新：本次运行自带的只读令牌存进 Windows 凭据管理器，读 GitHub 上最新发布的版本。
# 选了「测试」时另开两台 Windows 机器：一台跑后端全部测试，一台用真的 Electron 跑全部界面端到端测试（开发模式的后端，演示数据）。
# 选了「自动更新」时另开一台：打一个版本号是 0.0.1 的安装包装上，在应用里点「更新到」，看它用本次运行的只读令牌下载 GitHub
# 上最新发布的安装包、和 SHA256SUMS.txt 核对、关掉自己、静默安装、重新打开，新版本的后端答得上来。
# 安全规则同 build.yml：权限默认全关，只读检出；action 锁到提交；不用缓存、不用仓库密钥；依赖按锁文件装、不跑安装脚本。
name: Windows 检查

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 也算结构、扫一次（约 15 分钟；不选只查检查更新，约 4 分钟）
        type: boolean
        default: true
      tests:
        description: 在 Windows 上跑后端全部测试和全部界面端到端测试（两台机器同时跑，约 15–25 分钟）
        type: boolean
        default: false
      update:
        description: 自动更新：装一个旧版本（0.0.1），在应用里点「更新到」，装上 GitHub 上最新发布的版本（约 15 分钟）
        type: boolean
        default: false

permissions: {}

concurrency:   # one paid run at a time: starting it again replaces the run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_MANAGED_PYTHON: "1"
  UV_FROZEN: "1"

jobs:
  scan:
    name: 打包后的后端扫一次全市场
    if: inputs.scan || (!inputs.tests && !inputs.update)   # 只选「测试」或「自动更新」：不打这一份
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Windows 上按仓库原样检出（不改行尾）
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          checksum: 5d223efa0bf00208c3853246af09420419dfbd352536aa6bb8163d6170e23890   # uv-x86_64-pc-windows-msvc.zip
          enable-cache: false
      - name: 机器
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          "{0} 个逻辑处理器，内存 {1:N1} GB" -f $cs.NumberOfLogicalProcessors, ($cs.TotalPhysicalMemory / 1GB)
      - name: 打包后端
        working-directory: backend
        run: |
          uv sync --group build
          uv run --group build pyinstaller packaging/wb.spec --noconfirm --distpath dist --workpath build
      - name: 检查更新（令牌存进 Windows 凭据管理器，用它读 GitHub 上最新发布的版本）
        working-directory: backend
        env:
          CHECK_GITHUB_TOKEN: ${{ github.token }}   # this run's own token: read-only (contents: read), gone when the run ends
        run: uv run python packaging/scan_check.py update dist\wb-backend\wb-backend.exe "$env:RUNNER_TEMP\upd"
      - name: 模拟市场（300 只、全尺寸 6000 只、一半 3000 只）
        if: inputs.scan
        working-directory: backend
        run: |
          uv run python packaging/bench_data.py "$env:RUNNER_TEMP\small" 300
          uv run python packaging/bench_data.py "$env:RUNNER_TEMP\bench"
          uv run python packaging/bench_data.py "$env:RUNNER_TEMP\half" 3000
      - name: 一个进程算结构（不用进程池：打包后的 numba、polars 本身）
        if: inputs.scan
        working-directory: backend
        run: uv run python packaging/scan_check.py structures dist\wb-backend\wb-backend.exe "$env:RUNNER_TEMP\small" 1 5
      - name: 进程池算全市场结构（6000 只）
        if: inputs.scan
        working-directory: backend
        run: uv run python packaging/scan_check.py structures dist\wb-backend\wb-backend.exe "$env:RUNNER_TEMP\bench" 0 15
      - name: 像扫描按钮那样扫一次（3000 只：扫描时后端要七八 GB，这台机器只有 8 GB）
        if: inputs.scan
        working-directory: backend
        run: uv run python packaging/scan_check.py scan dist\wb-backend\wb-backend.exe "$env:RUNNER_TEMP\half" 20

  tests:
    name: 后端全部测试
    if: inputs.tests
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring   # no keychain, no keys: no test reaches a real source
    steps:
      - name: Windows 上按仓库原样检出（不改行尾）
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          checksum: 5d223efa0bf00208c3853246af09420419dfbd352536aa6bb8163d6170e23890   # uv-x86_64-pc-windows-msvc.zip
          enable-cache: false
      - name: 后端全部测试（不含要联网的；临时目录和 numba 缓存放在带中文和空格的路径里，像中文用户名的电脑）
        working-directory: backend
        run: |
          $t = Join-Path $env:RUNNER_TEMP "临时 数据"
          New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $t; $env:TMP = $t; $env:NUMBA_CACHE_DIR = Join-Path $t "numba 缓存"
          uv sync
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run pytest -q -p no:cacheprovider

  e2e:
    name: 界面端到端测试（真的 Electron）
    if: inputs.tests
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Windows 上按仓库原样检出（不改行尾）
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          checksum: 5d223efa0bf00208c3853246af09420419dfbd352536aa6bb8163d6170e23890   # uv-x86_64-pc-windows-msvc.zip
          enable-cache: false
      - name: 后端依赖（按锁文件）
        working-directory: backend
        run: uv sync
      - name: 界面（按锁文件装，不跑安装脚本）
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
      - name: Electron（按锁文件装；Electron 本身按官方校验值下载）
        working-directory: desktop
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run electron:install
      - name: 全部界面端到端测试（各自的临时数据目录，在带中文和空格的路径里；碰不到任何真的数据源）
        working-directory: desktop
        run: |
          $t = Join-Path $env:RUNNER_TEMP "临时 数据"
          New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $t; $env:TMP = $t
          npx playwright test
      - name: 失败时留下现场（1 天）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: desktop/test-results
          retention-days: 1

  update:
    name: 自动更新（旧版本点「更新到」，装上 GitHub 上最新发布的版本）
    if: inputs.update
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read   # the run's own token reads the releases: the app downloads the newest installer with it
    steps:
      - name: Windows 上按仓库原样检出（不改行尾）
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          checksum: 5d223efa0bf00208c3853246af09420419dfbd352536aa6bb8163d6170e23890   # uv-x86_64-pc-windows-msvc.zip
          enable-cache: false
      - name: 版本号改成 0.0.1（只在这台机器上：好让 GitHub 上最新发布的版本比它新）
        run: |
          $f = "desktop/package.json"; (Get-Content $f -Raw) -replace '"version": "[^"]+"', '"version": "0.0.1"' | Set-Content $f -NoNewline
          $f = "backend/wb/__init__.py"; (Get-Content $f -Raw) -replace '__version__ = "[^"]+"', '__version__ = "0.0.1"' | Set-Content $f -NoNewline
          Select-String -Path desktop/package.json, backend/wb/__init__.py -Pattern '0\.0\.1'
      - name: 打包
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-win.ps1
      - name: 安装（静默，装到默认位置，像第一次装那样）
        working-directory: desktop
        run: |
          $p = Start-Process (Get-Item dist\xingyan-0.0.1-win-x64.exe).FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode) { throw "安装失败，退出码 $($p.ExitCode)" }
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -like "形研*" } |
            Select-Object DisplayName, DisplayVersion, InstallLocation | Format-List
      - name: 在应用里点「更新到」：下载、核对、关掉、静默安装、重新打开
        working-directory: desktop
        env:
          WB_SECRET_GITHUB_TOKEN: ${{ github.token }}   # this run's own token: read-only (contents: read), gone when the run ends
        run: |
          $installed = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -like "形研*" }
          $env:WB_UPDATE_APP = Join-Path $installed.InstallLocation "形研.exe"
          npx playwright test tests/update.spec.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -like "形研*" } |
            Select-Object DisplayName, DisplayVersion, InstallLocation | Format-List
      - name: 失败时留下现场（1 天）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-results
          path: desktop/test-results
          retention-days: 1
